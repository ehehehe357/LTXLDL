# 1. Thông tin thành phố và đường dẫn Inside Airbnb
city: prague
data_root: czech-republic/prague/prague
currency: CZK

# 2. Bốn mốc chụp bắt buộc (thay bằng 4 ngày cụ thể nhóm được phân công)
snapshots:
  - "2025-09-23"
  - "2025-12-27"
  - "2026-03-29"
  - "2026-06-27"

# 3. Tham số cho bộ quy tắc QA (Làm sạch dữ liệu)
qa:
  # Ngưỡng giá tối đa theo tiền Koruna Séc (CZK) để lọc ngoại lai
  price_max_czk: 50000
  # Giới hạn số đêm thuê tối thiểu hợp lý
  min_nights_cap: 365
  # Các cột khóa dùng để kiểm tra trùng lặp
  dedupe_keys:
    - id
    - last_scraped

# 4. Tham số tính toán KPI
kpi:
  area_col: neighbourhood_cleansed

# 5. Cấu hình phân tích bằng LLM
llm:
  provider: gemini
  model: gemini-3.1-flash-lite
  sample_size: 1000
  aspects:
    - vị trí
    - sạch sẽ
    - chủ nhà
    - giá trị
    - tiện nghi
    - độ ồn
    - an toàn
  cache: data/processed/llm_cache.jsonl
  summary_csv: "data/processed/llm_sentiment_summary.csv"
  seed: 42